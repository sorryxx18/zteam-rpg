<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#233d39"><title>犀牛搶水源｜像素街區</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="stylesheet" href="./style.css?v=2"></head>
<body><main id="app"><header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">✦</span><div><h1>犀牛搶水源<span>像素街區</span></h1><p>自由探索・試玩版</p></div></div><div class="music-controls"><label for="music-track">復古音樂</label><select id="music-track" aria-label="音樂曲目"></select><button id="music-toggle" aria-pressed="false">音樂重試</button><small id="music-status" role="status">開始探索後播放</small></div><button id="settings">重新選擇</button></header>
<section id="world" aria-label="可自由探索的像素街區"><canvas id="game" tabindex="0" aria-label="遊戲畫面，使用方向鍵或WASD走動"></canvas><div class="location"><span class="live-dot"></span><strong id="location">莊敬分隊</strong><small id="road">準備出發</small></div><div class="tools"><button id="overview-open">轄區地圖</button><button id="home" aria-label="回出發點" title="回出發點">⌂</button><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="縮小">−</button></div><div class="map-panel"><span>街區小地圖 <b>北 ↑</b></span><canvas id="minimap" width="128" height="100" aria-label="附近道路小地圖"></canvas></div><div id="message" role="status">正在準備街區…</div><p class="keyboard-hint">WASD / 方向鍵 移動 <i>·</i> Shift 奔跑</p><div class="touch-controls"><button id="run" aria-label="按住奔跑">跑</button><div id="dpad" aria-label="觸控方向鍵"><button data-key="ArrowUp" class="up" aria-label="向上">▲</button><button data-key="ArrowLeft" class="left" aria-label="向左">◀</button><span class="pad-center">✦</span><button data-key="ArrowRight" class="right" aria-label="向右">▶</button><button data-key="ArrowDown" class="down" aria-label="向下">▼</button></div></div></section>
<footer><span>走進熟悉的街角，慢慢探索。</span><small>僅供遊戲，非搶救圖資 · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a></small></footer></main><dialog id="start-screen" aria-labelledby="start-title"><h2 id="start-title">犀牛搶水源</h2><p>自由探索・試玩版</p><p>先選旅人與出發分隊，再走進熟悉的街角。</p><div id="characters" class="characters" role="group" aria-label="選擇角色"><button data-start-character="male" data-character="male" aria-pressed="false"><canvas width="64" height="80" aria-hidden="true"></canvas>男隊員</button><button data-start-character="female" data-character="female" aria-pressed="false"><canvas width="64" height="80" aria-hidden="true"></canvas>女隊員</button><button data-start-character="rhino" data-character="rhino" aria-pressed="true"><canvas width="64" height="80" aria-hidden="true"></canvas>犀牛</button></div><label class="station-label">出發分隊<select id="start-station"></select></label><p id="start-status" role="status">正在準備地圖與角色…</p><button id="start-game" disabled>開始探索</button></dialog><dialog id="overview-dialog" aria-labelledby="overview-title"><h2 id="overview-title">轄區地圖</h2><p id="overview-status">正在讀取全區道路…</p><canvas id="overview-map" width="900" height="460" aria-label="全轄區道路、九個分隊與你在這裡"></canvas><button id="overview-close">返回街區</button></dialog><script type="module" src="./game.js?v=2"></script></body></html>
