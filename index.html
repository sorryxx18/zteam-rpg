<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#233d39"><title>犀牛出任務｜像素街區</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="stylesheet" href="./style.css"></head>
<body><main id="app"><header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">✦</span><div><h1>犀牛出任務<span>像素街區</span></h1><p>自由探索・試玩版</p></div></div><details id="settings"><summary>旅人與出發點 <span>⌄</span></summary><div class="settings-panel"><div id="characters" class="characters" role="group" aria-label="選擇角色"><button data-character="male" aria-pressed="false"><canvas width="64" height="80" aria-hidden="true"></canvas>男隊員</button><button data-character="female" aria-pressed="false"><canvas width="64" height="80" aria-hidden="true"></canvas>女隊員</button><button data-character="rhino" aria-pressed="true"><canvas width="64" height="80" aria-hidden="true"></canvas>犀牛</button></div><label class="station-label">出發分隊<select id="station" aria-label="出發分隊"></select></label></div></details></header>
<section id="world" aria-label="可自由探索的像素街區"><canvas id="game" tabindex="0" aria-label="遊戲畫面，使用方向鍵或WASD走動"></canvas><div class="location"><span class="live-dot"></span><strong id="location">莊敬分隊</strong><small id="road">準備出發</small></div><div class="tools"><button id="home" aria-label="回出發點" title="回出發點">⌂</button><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="縮小">−</button></div><div class="map-panel"><span>街區小地圖 <b>北 ↑</b></span><canvas id="minimap" width="128" height="100" aria-label="附近道路小地圖"></canvas></div><div id="message" role="status">正在準備街區…</div><p class="keyboard-hint">WASD / 方向鍵 移動 <i>·</i> Shift 奔跑</p><div class="touch-controls"><button id="run" aria-label="按住奔跑">跑</button><div id="dpad" aria-label="觸控方向鍵"><button data-key="ArrowUp" class="up" aria-label="向上">▲</button><button data-key="ArrowLeft" class="left" aria-label="向左">◀</button><span class="pad-center">✦</span><button data-key="ArrowRight" class="right" aria-label="向右">▶</button><button data-key="ArrowDown" class="down" aria-label="向下">▼</button></div></div></section>
<footer><span>走進熟悉的街角，慢慢探索。</span><small>僅供遊戲，非搶救圖資 · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a></small></footer></main><script type="module" src="./game.js"></script></body></html>
